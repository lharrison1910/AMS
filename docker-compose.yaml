services:
  db:
    image: postgres:17
    container_name: db
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin,
      - POSTGRES_DB=AMS
    volumes:
      - database:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pg-admin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"

volumes:
  database:
    driver: local
